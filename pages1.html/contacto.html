<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactá a Génova para consultar por velas de soja, souvenirs y regalos personalizados.">
  <title>Contacto - Génova velas de soja</title>

  <!-- Bootstrap CSS primero -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Tu CSS personalizado al final -->
  <link rel="stylesheet" href="../assets/style.css">

  
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
  <link rel="manifest" href="../icons/site.webmanifest">

</head>

<body>

  <!-- Header -->
  <header>
    <img class="logo" src="../img/logo_genova.png" alt="imagen de logo de vela">
  </header>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Génova</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
              data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="./sobreMi.html">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link active" href="./contacto.html">Contacto</a></li>
<li class="nav-item"><a class="nav-link" href="./catalogo.html">Catálogo</a></li>
<li class="nav-item"><a class="nav-link" href="./ofertas.html">Ofertas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Carrusel Bootstrap -->
  <div id="carouselExample" class="carousel slide">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3"></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="../img/collage_souvenir_op1.jpeg" class="d-block w-100" alt="collage de 4 fotos opcion 1">
    </div>
    <div class="carousel-item">
      <img src="../img/collage_souvenir_op2.jpeg" class="d-block w-100" alt="collage con cuatro fotos de velas">
    </div>
    <div class="carousel-item">
      <img src="../img/collage_souvenir_op3.jpeg" class="d-block w-100" alt="collage opcion 3">
    </div>
    <div class="carousel-item">
      <img src="../img/collage_comunion_bautismo.jpeg" class="d-block w-100" alt="collage opcion 4">
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
  <!-- Contenido de contacto -->
  <main class="container mt-4 contacto">
    <h1 class="mb-4">Contacto</h1>
    <form>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribe tu mensaje..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">Enviar</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footerRedes">
      <p>Podés escribirnos a nuestras redes sociales o completar el formulario...</p>
      <a href="https://www.instagram.com/genova.velasdesoja" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>
      <a href="https://www.facebook.com/GenovaVelasdeSoja" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-facebook"></i> Facebook
      </a>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
